  <!--
    Fetch the brand face alongside the engine instead of after it.

    Without this the first frame paints in the browser's fallback sans and
    re-flows once Neo Sans Arabic arrives — which is the wrong typeface on
    screen for as long as the download takes. The three weights below are the
    ones the type ramp uses; the rest load afterwards.
  -->

        href="assets/fonts/NeoSansArabic-Regular.ttf">
  <link rel="preload" as="font" type="font/ttf" crossorigin

  <!--
    The loading screen shown until Flutter paints its first frame.

    Everything it needs is inline — the mark is an SVG element, not a fetched
    image — so it paints as soon as the document parses, long before the engine,
    the asset bundle or the fonts arrive. Its ground and its purple mark are the
    login screen's, so the hand-over reads as one screen settling rather than
    two screens replacing each other.
  -->
  <style>
    @font-face {
      font-family: 'NeoSansArabic';
      src: url('assets/fonts/NeoSansArabic-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'NeoSansArabic';
      src: url('assets/fonts/NeoSansArabic-Medium.ttf') format('truetype');
      font-weight: 500;
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #FFFFFF;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      /* AppMotion.slow + AppMotion.exit — leaves without lingering. */
      transition: opacity 300ms cubic-bezier(0.32, 0, 0.67, 0);
    }

    #loader[data-done] {
      opacity: 0;
      pointer-events: none;
    }

    .loader__stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 24px;
    }

    /* AppMotion.rise + AppMotion.standard, staggered like the login form. */
    .loader__mark,
    .loader__progress {
      animation: loader-rise 300ms cubic-bezier(0.215, 0.61, 0.355, 1) both;
    }

    .loader__progress {
      animation-delay: 70ms;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loader__mark {
      display: block;
      width: 108px;
      height: 120px;
      color: #2F1156; /* AppColors.primary */
    }

    .loader__track {
      position: relative;
      width: 160px;
      height: 4px;
      border-radius: 999px;
      background: #EEEEEE; /* AppColors.grey100 */
      overflow: hidden;
    }

    .loader__runner {
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: #2F1156; /* AppColors.primary */
      animation: loader-run 1200ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    .loader__caption {
      margin: 0;
      font-family: 'NeoSansArabic', system-ui, sans-serif;
      font-size: 14px; /* AppTextStyles.bodyMedium */
      font-weight: 400;
      line-height: 1.6;
      color: #747474; /* AppColors.grey700 */
    }

    /*
      Shown instead of the progress bar when the engine never boots — a blank
      white page tells the user nothing, and the loader fading out onto one is
      worse than staying put with a reason and a way out.
    */
    .loader__error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    #loader[data-failed] .loader__progress { display: none; }

    #loader[data-failed] .loader__error {
      display: flex;
      animation: loader-rise 300ms cubic-bezier(0.215, 0.61, 0.355, 1) both;
    }

    .loader__error-title {
      margin: 0;
      font-family: 'NeoSansArabic', system-ui, sans-serif;
      font-size: 18px; /* AppTextStyles.h4 */
      font-weight: 500;
      line-height: 1.4;
      color: #0E0E0E; /* AppColors.grey1000 */
    }

    /*
      The address or message that actually failed. Without it the screen can
      only guess at a cause — and guessing "check your connection" sends the
      reader after their router when the fault is on the server.
    */
    .loader__detail {
      margin: 0;
      max-width: 340px;
      direction: ltr;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #A3A3A3; /* AppColors.grey500 */
    }

    .loader__detail:empty { display: none; }

    .loader__retry {
      margin-top: 4px;
      padding: 10px 28px;
      border: 0;
      border-radius: 12px; /* AppSizes.radiusMd */
      background: #F5BC5A; /* AppColors.accentAmber */
      color: #FFFFFF; /* AppColors.onAmber */
      font-family: 'NeoSansArabic', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 140ms ease; /* AppMotion.fast */
    }

    .loader__retry:hover { background: #E0A63F; /* AppColors.amberDark */ }
    .loader__retry:active { transform: scale(0.97); /* AppMotion.pressScale */ }

    @keyframes loader-rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    /* Runs right to left, with the reading direction. */
    @keyframes loader-run {
      0%   { transform: translateX(100%); }
      100% { transform: translateX(-250%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader__mark,
      .loader__progress {
        animation: none;
      }
      .loader__runner {
        animation: none;
        right: auto;
        left: 0;
        width: 100%;
        opacity: 0.35;
      }
    }
  </style>

  <script>
    (function () {
      var loader = document.getElementById('loader');
      if (!loader) return;

      var settled = false;
      var graceTimer = null;
      // What went wrong, kept for the error screen. The first failure is the
      // useful one — later ones are usually its fallout.
      var detail = '';
      // A boot that simply stalls, with nothing thrown, still has to end.
      var stallTimer = window.setTimeout(fail, 30000);

      function stopTimers() {
        window.clearTimeout(stallTimer);
        window.clearTimeout(graceTimer);
      }

      function dismiss() {
        if (settled) return;
        settled = true;
        stopTimers();
        loader.setAttribute('data-done', '');
        // Outlives the fade above, then takes the node out of the tree so it
        // can never swallow a pointer event.
        window.setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 320);
      }

      function fail() {
        if (settled) return;
        settled = true;
        stopTimers();
        if (detail) {
          document.getElementById('loader-detail').textContent =
            detail.slice(0, 180);
        }
        loader.setAttribute('data-failed', '');
      }

      function note(what) {
        if (!detail && what) detail = String(what);
      }

      // One thrown error is not proof the boot is dead — a retried request or a
      // failed service worker still ends in a running app. Give the first frame
      // a moment to arrive before calling it.
      function suspectFailure() {
        if (settled || graceTimer) return;
        graceTimer = window.setTimeout(fail, 3000);
      }

      // The engine fires this the moment the app has something on screen.
      window.addEventListener('flutter-first-frame', dismiss);

      // A boot script or module that never arrives (wrong MIME type, missing
      // file, offline) surfaces here rather than as a blank page.
      window.addEventListener('error', function (event) {
        var el = event.target;
        if (!el || el === window) return;
        note(el.src || el.href);
        suspectFailure();
      }, true);

      // Where an asset the engine fetched itself lands — a manifest answered
      // with an HTML page, for one.
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        note(reason && (reason.message || reason));
        suspectFailure();
      });

      document.getElementById('loader-retry')
        .addEventListener('click', function () { window.location.reload(); });
    })();
  </script>
